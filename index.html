<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Page</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <button id="mode-toggle">Toggle Light/Dark Mode</button>
        <h1>Game Title</h1>
        <div id="socials">
            <a href="https://instagram.com/w_j56">Instagram</a>
            <a href="https://tiktok.com/@s43ci">TikTok</a>
        </div>
    </header>
    <main>
        <div id="game">
            <!-- Game UI elements go here -->
            <p id="round-counter">Round: <span id="round-number">1</span></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Game Company</p>
    </footer>
    <script>
        let darkMode = false;

        // Toggle light/dark mode
        document.getElementById('mode-toggle').onclick = function() {
            darkMode = !darkMode;
            document.body.className = darkMode ? 'dark' : 'light';
        };

        // Simulate the game round counter
        let roundNumber = 1;

        function addEntry() {
            // logic to add an entry
            roundNumber++;
            document.getElementById('round-number').textContent = roundNumber;
        }

        function deleteEntry() {
            // logic to delete an entry
            if (roundNumber > 1) {
                roundNumber--;
            }
            document.getElementById('round-number').textContent = roundNumber;
        }

        // Background Animation
        function startBackgroundAnimation() {
            document.body.style.background = 'linear-gradient(-45deg, #f3ec78, #af4261)';
            document.body.style.backgroundSize = '400% 400%';

            let animation = setInterval(() => {
                let color1 = Math.floor(Math.random() * 256);
                let color2 = Math.floor(Math.random() * 256);
                document.body.style.background = `linear-gradient(-45deg, rgba(${color1},${color1},255,1), rgba(${color2},${color2},255,1))`;
            }, 3000);
        }

        startBackgroundAnimation();
    </script>
</body>
</html>
